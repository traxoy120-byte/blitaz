<!DOCTYPE html>
<html>
<head>
  <title>Blitz AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Montserrat', sans-serif; background: #0e0e1c; color: white; padding: 2em; }
    input, button { font-family: inherit; padding: 0.5em; margin-top: 1em; }
  </style>
</head>
<body>
  <h1>Blitz AI</h1>
  <input id="prompt" placeholder="Ask me anything..." />
  <button onclick="ask()">Send</button>
  <pre id="response"></pre>

  <script>
    async function ask() {
      const prompt = document.getElementById("prompt").value;
      const res = await fetch("/api/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt })
      });
      const data = await res.json();
      document.getElementById("response").textContent = data.reply;
    }
  </script>
</body>
</html>
