<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Blitz AI</title>
</head>
<body>
  <h1>Blitz AI</h1>
  <input type="text" id="prompt" placeholder="Ask something..." />
  <button onclick="ask()">Send</button>
  <div id="response">Your response will appear here.</div>

  <script>
    async function ask() {
      const prompt = document.getElementById("prompt").value;
      const responseBox = document.getElementById("response");

      if (!prompt) {
        responseBox.textContent = "Please enter a prompt.";
        return;
      }

      responseBox.textContent = "Thinking...";

      try {
        const res = await fetch("/api/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt })
        });

        const data = await res.json();

        if (res.ok) {
          responseBox.textContent = data.reply;
        } else {
          responseBox.textContent = `⚠️ Blitz AI error: ${data.error || "Unknown server error"}`;
        }
      } catch (err) {
        responseBox.textContent = `⚠️ Network error: ${err.message}`;
      }
    }
  </script>
</body>
</html>
